# NeoManager 依赖版本目录（Version Catalog）
# 版本策略：锁定最新稳定版，升级需本地 + CI 双验证
# 协议红线：禁止引入 GPL-3.0 之外的强传染协议依赖（sora-editor 以 LGPL 动态依赖方式使用）

[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ktlintGradle = "14.2.0"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
navigationCompose = "2.10.2"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
coroutines = "1.11.0"
junitJupiter = "5.14.4"
junitPlatform = "1.14.4"

# 启动冒烟测试（Robolectric：JVM 运行真实 Android 框架，可启动 Activity 复现启动闪退）
junit4 = "4.13.2"
robolectric = "4.17"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"

# Phase 1 ② 引擎接入：压缩引擎（全部非传染协议，见 THIRD-PARTY-NOTICES.md）
commonsCompress = "1.28.0"
zstdJni = "1.5.7-3"
xzJava = "1.10"
junrar = "7.5.9"

# Phase 1 ② 引擎接入：平台执行环境（均为 Apache-2.0）
libsu = "6.0.0"
shizuku = "13.1.5"

# Phase 1 ② 引擎接入：代码编辑器（LGPL-2.1，动态依赖）
soraEditor = "0.23.4"

[libraries]
# AndroidX 基础
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Jetpack Compose（版本统一由 BOM 管理）
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Kotlin 协程（ui 模块后台列表扫描）
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# 压缩引擎（engine-core，纯 JVM）
# commons-compress: zip/tar/gzip/xz/zstd/7z 读写框架（Apache-2.0）
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
# zstd-jni: zstd 编解码本地实现（BSD-2-Clause，commons-compress 声明式依赖）
zstd-jni = { group = "com.github.luben", name = "zstd-jni", version.ref = "zstdJni" }
# xz: xz 编解码（Public Domain，commons-compress 声明式依赖）
xz-java = { group = "org.tukaani", name = "xz", version.ref = "xzJava" }
# junrar: rar4 只读解包（unRar 自由软件许可，蓝图第三节明确采用）
junrar = { group = "com.github.junrar", name = "junrar", version.ref = "junrar" }

# 平台执行环境（engine-android，Apache-2.0）
libsu-core = { group = "com.github.topjohnwu.libsu", name = "core", version.ref = "libsu" }
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }

# 代码编辑器（editor 模块，LGPL-2.1 动态依赖）
sora-editor = { group = "io.github.Rosemoe.sora-editor", name = "editor", version.ref = "soraEditor" }

# 测试（engine-core，纯 JVM）
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitPlatform" }
kotlin-test-junit5 = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit5" }

# 测试（app 启动冒烟，Robolectric）
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit-ktx", version.ref = "androidxTestExtJunit" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
