# NeoManager Android CI
#
# 触发：push 到 main / PR / 手动
# 职责：编译验证（assembleDebug）+ engine-core 单元测试 + ktlint 代码规范检查
# 产物：app-debug APK（保留供手动安装尝鲜）
#
# 说明：公开仓库 Actions 免费不限时；Gradle 依赖经 setup-gradle 自动缓存

name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 构建 & 测试 & 规范检查
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v6

      - name: assembleDebug + engine-core 单测 + ktlint
        run: ./gradlew assembleDebug :engine-core:test ktlintCheck --stacktrace

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
