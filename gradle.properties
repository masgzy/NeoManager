# JVM 参数：构建守护进程内存与编码
# 内存预算说明：按 4GB 内存环境（本地沙箱/低端 CI）收敛；Kotlin 编译采用
# in-process 策略合并进 Gradle 进程，避免双守护进程叠加超限
org.gradle.jvmargs=-Xmx2304m -XX:MaxMetaspaceSize=448m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
kotlin.compiler.execution.strategy=in-process

# 并行与缓存：多模块增量构建提速（工作线程数对齐 2 核环境）
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=2

# AndroidX 与 modern Android Gradle Plugin 必开项
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin 官方代码风格（ktlint 依据）
kotlin.code.style=official
